<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APB Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            padding: 30px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: rgb(0, 255, 65);
        }
        .header a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 14px;
        }
        .header a:hover { color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 40px; }

        .period-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }
        .period-tab {
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            color: rgba(255,255,255,0.6);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .period-tab.active {
            background: rgb(0, 255, 65);
            color: #000;
            border-color: rgb(0, 255, 65);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #141414;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
        }
        .stat-card .label {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }
        .stat-card .sub {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin-top: 6px;
        }

        .charts-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: #141414;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
        }
        .chart-card h3 {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            margin-bottom: 20px;
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 160px;
            padding-top: 10px;
        }
        .bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }
        .bar {
            width: 100%;
            min-height: 2px;
            border-radius: 3px 3px 0 0;
            transition: height 0.3s;
        }
        .bar.sessions { background: rgb(0, 255, 65); }
        .bar.text { background: #4fc3f7; }
        .bar.voice { background: #ff9800; }
        .bar-label {
            font-size: 9px;
            color: rgba(255,255,255,0.3);
            margin-top: 6px;
            text-align: center;
            white-space: nowrap;
        }
        .bar-tooltip {
            font-size: 9px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
        }

        .donut-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        .donut-svg { width: 140px; height: 140px; }
        .donut-legend { display: flex; flex-direction: column; gap: 10px; }
        .donut-legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: rgba(255,255,255,0.7);
        }
        .donut-legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .table-card {
            background: #141414;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
            overflow-x: auto;
        }
        .table-card h3 {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            margin-bottom: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        td {
            font-size: 13px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.7);
        }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-mobile { background: rgba(255, 152, 0, 0.15); color: #ff9800; }
        .badge-desktop { background: rgba(79, 195, 247, 0.15); color: #4fc3f7; }
        .badge-active { background: rgba(0, 255, 65, 0.15); color: rgb(0, 255, 65); }
        .badge-ended { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.3); }

        .chart-legend {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
        }
        .chart-legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
        }
        .chart-legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
        }

        .refresh-info {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.2);
        }

        .uptime { color: rgba(255,255,255,0.3); font-size: 13px; }

        @media (max-width: 768px) {
            .header { padding: 20px; }
            .container { padding: 20px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-row { grid-template-columns: 1fr; }
            .stat-card .value { font-size: 28px; }
            .donut-container { flex-direction: column; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>APB Analytics</h1>
        <div style="display:flex;align-items:center;gap:20px;">
            <span class="uptime" id="uptime"></span>
            <a href="/chat.html">Back to App</a>
        </div>
    </div>

    <div class="container">
        <div class="period-tabs">
            <button class="period-tab active" data-period="today">Today</button>
            <button class="period-tab" data-period="week">7 Days</button>
            <button class="period-tab" data-period="month">30 Days</button>
            <button class="period-tab" data-period="allTime">All Time</button>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="charts-row">
            <div class="chart-card">
                <h3>Sessions (Last 30 Days)</h3>
                <div class="chart-legend">
                    <div class="chart-legend-item"><div class="chart-legend-dot" style="background:rgb(0,255,65)"></div>Sessions</div>
                    <div class="chart-legend-item"><div class="chart-legend-dot" style="background:#4fc3f7"></div>Text Chats</div>
                    <div class="chart-legend-item"><div class="chart-legend-dot" style="background:#ff9800"></div>Voice Uses</div>
                </div>
                <div class="bar-chart" id="dailyChart"></div>
            </div>
            <div class="chart-card">
                <h3>Device Breakdown</h3>
                <div class="donut-container" id="donutChart"></div>
            </div>
        </div>

        <div class="charts-row" style="grid-template-columns:1fr;">
            <div class="chart-card">
                <h3>Today's Activity by Hour</h3>
                <div class="bar-chart" id="hourlyChart"></div>
            </div>
        </div>

        <div class="table-card">
            <h3>Recent Sessions</h3>
            <table>
                <thead>
                    <tr>
                        <th>Session</th>
                        <th>Device</th>
                        <th>Text Chats</th>
                        <th>Voice Uses</th>
                        <th>Shares</th>
                        <th>Duration</th>
                        <th>Time</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="sessionsTable"></tbody>
            </table>
        </div>

        <div class="refresh-info">Auto-refreshes every 30 seconds</div>
    </div>

    <script>
        let currentPeriod = 'today';
        let data = null;

        document.querySelectorAll('.period-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentPeriod = tab.dataset.period;
                if (data) renderStats(data);
            });
        });

        function formatDuration(secs) {
            if (!secs || secs <= 0) return '-';
            if (secs < 60) return secs + 's';
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            if (m < 60) return m + 'm ' + s + 's';
            const h = Math.floor(m / 60);
            return h + 'h ' + (m % 60) + 'm';
        }

        function formatTime(ts) {
            if (!ts) return '-';
            const d = new Date(ts);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
            if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
                   d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }

        function formatUptime(secs) {
            const d = Math.floor(secs / 86400);
            const h = Math.floor((secs % 86400) / 3600);
            const m = Math.floor((secs % 3600) / 60);
            if (d > 0) return `Server uptime: ${d}d ${h}h`;
            if (h > 0) return `Server uptime: ${h}h ${m}m`;
            return `Server uptime: ${m}m`;
        }

        function renderStats(d) {
            const s = d[currentPeriod];
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                <div class="stat-card">
                    <div class="label">Unique Visitors</div>
                    <div class="value">${s.total.toLocaleString()}</div>
                    <div class="sub">${s.mobile} mobile / ${s.desktop} desktop</div>
                </div>
                <div class="stat-card">
                    <div class="label">Avg Session Duration</div>
                    <div class="value">${formatDuration(s.avgDuration)}</div>
                    <div class="sub">Longest: ${formatDuration(s.maxDuration)}</div>
                </div>
                <div class="stat-card">
                    <div class="label">Text Chat Messages</div>
                    <div class="value">${s.totalTextChats.toLocaleString()}</div>
                    <div class="sub">${s.withText} sessions used text</div>
                </div>
                <div class="stat-card">
                    <div class="label">Voice Sessions</div>
                    <div class="value">${s.totalVoiceSessions.toLocaleString()}</div>
                    <div class="sub">${s.withVoice} sessions used voice</div>
                </div>
                <div class="stat-card">
                    <div class="label">Share Clicks</div>
                    <div class="value">${s.totalShareClicks.toLocaleString()}</div>
                    <div class="sub">${s.withShare} sessions shared</div>
                </div>
                <div class="stat-card">
                    <div class="label">Engagement Rate</div>
                    <div class="value">${s.total ? Math.round(((s.withText + s.withVoice) / s.total) * 100) : 0}%</div>
                    <div class="sub">Used text or voice</div>
                </div>
            `;
        }

        function renderDailyChart(dailyData) {
            const chart = document.getElementById('dailyChart');
            const maxVal = Math.max(1, ...dailyData.map(d => Math.max(d.sessions, d.textChats, d.voiceSessions)));
            chart.innerHTML = dailyData.map(d => {
                const sh = Math.max(2, (d.sessions / maxVal) * 140);
                const th = Math.max(0, (d.textChats / maxVal) * 140);
                const vh = Math.max(0, (d.voiceSessions / maxVal) * 140);
                const label = d.date.slice(5);
                const showLabel = dailyData.indexOf(d) % 3 === 0;
                return `<div class="bar-wrapper">
                    <div class="bar-tooltip">${d.sessions > 0 ? d.sessions : ''}</div>
                    <div style="display:flex;gap:1px;align-items:flex-end;width:100%;height:${sh}px;">
                        <div class="bar sessions" style="height:${sh}px;flex:1;"></div>
                        ${th > 0 ? `<div class="bar text" style="height:${th}px;flex:1;"></div>` : ''}
                        ${vh > 0 ? `<div class="bar voice" style="height:${vh}px;flex:1;"></div>` : ''}
                    </div>
                    <div class="bar-label">${showLabel ? label : ''}</div>
                </div>`;
            }).join('');
        }

        function renderHourlyChart(hourlyData) {
            const chart = document.getElementById('hourlyChart');
            const maxVal = Math.max(1, ...hourlyData.map(h => h.sessions));
            chart.innerHTML = hourlyData.map(h => {
                const height = Math.max(2, (h.sessions / maxVal) * 140);
                const label = h.hour % 3 === 0 ? (h.hour === 0 ? '12a' : h.hour < 12 ? h.hour + 'a' : h.hour === 12 ? '12p' : (h.hour - 12) + 'p') : '';
                return `<div class="bar-wrapper">
                    <div class="bar-tooltip">${h.sessions > 0 ? h.sessions : ''}</div>
                    <div class="bar sessions" style="height:${height}px;"></div>
                    <div class="bar-label">${label}</div>
                </div>`;
            }).join('');
        }

        function renderDonut(stats) {
            const container = document.getElementById('donutChart');
            const total = stats.mobile + stats.desktop || 1;
            const mPct = (stats.mobile / total) * 100;
            const dPct = (stats.desktop / total) * 100;
            const mAngle = (stats.mobile / total) * 360;
            const r = 52, cx = 70, cy = 70;
            const mRad = (mAngle - 90) * Math.PI / 180;
            const largeArc = mAngle > 180 ? 1 : 0;
            const x1 = cx, y1 = cy - r;
            const x2 = cx + r * Math.cos(mRad);
            const y2 = cy + r * Math.sin(mRad);

            let paths = '';
            if (stats.mobile === 0 && stats.desktop === 0) {
                paths = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="20"/>`;
            } else if (stats.mobile === 0) {
                paths = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#4fc3f7" stroke-width="20"/>`;
            } else if (stats.desktop === 0) {
                paths = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#ff9800" stroke-width="20"/>`;
            } else {
                paths = `
                    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#4fc3f7" stroke-width="20"/>
                    <path d="M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}" fill="none" stroke="#ff9800" stroke-width="20"/>
                `;
            }

            container.innerHTML = `
                <svg class="donut-svg" viewBox="0 0 140 140">${paths}</svg>
                <div class="donut-legend">
                    <div class="donut-legend-item">
                        <div class="donut-legend-dot" style="background:#ff9800"></div>
                        Mobile ${Math.round(mPct)}% (${stats.mobile})
                    </div>
                    <div class="donut-legend-item">
                        <div class="donut-legend-dot" style="background:#4fc3f7"></div>
                        Desktop ${Math.round(dPct)}% (${stats.desktop})
                    </div>
                </div>
            `;
        }

        function renderSessions(sessions) {
            const tbody = document.getElementById('sessionsTable');
            tbody.innerHTML = sessions.map(s => `
                <tr>
                    <td style="font-family:monospace;font-size:12px;">${s.id}</td>
                    <td><span class="badge badge-${s.device}">${s.device}</span></td>
                    <td>${s.textChats || 0}</td>
                    <td>${s.voiceSessions || 0}</td>
                    <td>${s.shareClicks || 0}</td>
                    <td>${formatDuration(s.duration)}</td>
                    <td style="font-size:12px;color:rgba(255,255,255,0.4);">${formatTime(s.startTime)}</td>
                    <td><span class="badge ${s.ended ? 'badge-ended' : 'badge-active'}">${s.ended ? 'ended' : 'active'}</span></td>
                </tr>
            `).join('');
        }

        async function fetchAndRender() {
            try {
                const res = await fetch('/api/analytics/data');
                data = await res.json();

                renderStats(data);
                renderDailyChart(data.dailyChart);
                renderHourlyChart(data.hourlyChart);
                renderDonut(data[currentPeriod]);
                renderSessions(data.recentSessions);

                document.getElementById('uptime').textContent = formatUptime(data.serverUptime);
            } catch (e) {
                console.error('Failed to fetch analytics:', e);
            }
        }

        fetchAndRender();
        setInterval(fetchAndRender, 30000);
    </script>
</body>
</html>
